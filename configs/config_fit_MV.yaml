# pytorch_lightning==1.9.0
seed_everything: true
trainer:
  accelerator: gpu
  strategy:
    class_path: pytorch_lightning.strategies.DDPStrategy
    init_args:
      find_unused_parameters: true
  devices: auto
  num_nodes: 1
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: 'val/total_loss'
        mode: 'min'
        save_top_k: 1
        save_last: true
        every_n_epochs: 1
        # dirpath: "lightning_logs/${logger.name}/version_${logger.version}/checkpoints/"
        filename: '{epoch}-{val/total_loss:.3f}'
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: 'lightning_logs'
      name: 'MVSML'
  fast_dev_run: false
  max_epochs: 60
  min_epochs: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: -1
  log_every_n_steps: 25
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  profiler: null
  detect_anomaly: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  # learning rate
  lr: 0.0003
  # weight decay
  wd: 0.001
  min_pred: 0.1
  max_pred: 8.0
  min_depth: 0.2
  max_depth: 5.0
  nsamples: 150
  img_h: 480
  img_w: 640
  useConvGRU: true

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0003
    weight_decay: 0.01

lr_scheduler:
  class_path: torch.optim.lr_scheduler.StepLR
  init_args:
    step_size: 5
    gamma: 0.5

data:
  class_path: dataloader.dataset.SMLDataConsistentModule
  init_args:
    data_root: '/media/saimouli/Data6T/datasets/VOID_150_small'
    sequence_length: 3
    img_size: [480, 640]
    batch_size: 2 #8
    num_workers: 0
ckpt_path: null # checkpoints to continue the training.